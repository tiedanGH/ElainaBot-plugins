# ============================================================================
# LGTBot 自动部署 — 失败报告页的 nginx 示例配置
#
# 本插件只把 HTML 写进   <插件目录>/data/reports/
# 并按「面板里的 report_base_url + 文件名」拼出链接。怎么把那个前缀对应到这个
# 目录, 完全由这里决定 —— 插件不启动任何 HTTP 服务。
#
# ---- 先做这一步: 建一个 ASCII 软链 ----------------------------------------
# 插件目录名是中文 (LGTBot自动部署)。nginx 按字节处理配置里的路径, 配置文件编码、
# 系统 locale、systemd 环境任何一处对不上, 拼出来的路径就找不到磁盘上的文件, 而
# 表现只是干巴巴的 404。别赌这个, 用软链把路径变成纯 ASCII:
#
#   sudo mkdir -p /var/www
#   sudo ln -sfn "/绝对路径/plugins/LGTBot自动部署/data/reports" /var/www/lgtbot-report
#
# 下面的 alias 一律指向这个软链。注意软链**不解决权限问题** —— nginx 穿越的是
# 真实路径, 见文件末尾「排错」第 1 条。
#
# ---- 再改三处 --------------------------------------------------------------
#   1. server_name          换成你的域名
#   2. alias                指向上面那个软链 (或你自己的 ASCII 路径)
#   3. ssl_certificate*     换成你的证书路径 (没有证书就先只留 :80 那段)
# 改完 nginx -t 验证, 再 systemctl reload nginx。
#
# 面板里 report_base_url 要填的值 = 下面 location 对应的完整外部地址, 例如方案 A
# 对应   https://deploy.example.com/lgtbot-report/
# 末尾有没有斜杠都行, 插件会自己规整成单斜杠。
# ============================================================================


# ---------------------------------------------------------------------------
# 方案 A (推荐): 挂在已有站点的一个子路径下, 不用单独申请证书
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deploy.example.com;

    ssl_certificate     /etc/letsencrypt/live/deploy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deploy.example.com/privkey.pem;

    # …你原有的 location / 等配置保持不动…

    # 报告页。用**带捕获的正则 location**, 而不是「前缀 location + 内层 location」:
    #   · 前缀 location 里套一个 location ~ \.html$ 再配 alias, 是 nginx 出名的
    #     易错组合 —— 内层匹配后路径怎么拼很容易和预期不一致, 症状就是明明有文件
    #     却 404。这里一层解决, 没有歧义。
    #   · 正则顺便把文件名字符集焊死。插件生成的名字形如
    #     20260903-142055-7c3a-1f2e3d4c5b6a7988.html, 只用到 [0-9a-zA-Z._-],
    #     写死这个集合等于顺手挡掉了路径穿越与各种奇怪请求。
    #   · 匹配不到目录本身, 所以也就不存在列目录的可能。
    location ~* ^/lgtbot-report/(?<report_file>[A-Za-z0-9._-]+\.html)$ {
        alias /var/www/lgtbot-report/$report_file;

        # 报告链接一次性发到群里, 内容之后也不会变 —— 缓存一天;
        # 同时告诉搜索引擎别收录 (页面里也有 <meta name="robots">, 双保险)
        expires 1d;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # 页面是插件生成的纯静态 HTML, 内联一段 <style>, 没有任何脚本、图片、
        # 外部字体或表单 —— CSP 可以收到极紧。真出现 XSS (插件侧已对所有动态
        # 文字做 html.escape), 这条是最后一道闸
        add_header Content-Security-Policy
            "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # 只把 404 当「报告不存在」。**403 千万别一起收进来** —— 403 几乎总是目录
        # 权限问题 (nginx worker 穿不过 /home/<用户> 这类 700/750 的目录), 和「报告
        # 已被删」是完全两回事。两者合并成同一个页面的话, 你会对着一个权限问题
        # 反复去找一个其实存在的文件。403 就让它原样报出来, 一眼能认出。
        error_page 404 = @report_gone;
    }

    # 目录本身、以及文件名不合规的请求: 直接 404, 不要落到 location /
    location /lgtbot-report/ {
        return 404;
    }

    location @report_gone {
        default_type "text/html; charset=utf-8";
        return 404 '<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告不存在</title><body style="font:15px/1.7 system-ui,sans-serif;max-width:640px;margin:16vh auto;padding:0 20px;color:#444"><h1 style="font-size:20px">报告不存在或已被删除</h1><p>链接可能不完整，或对应的审核记录已在后台清理。请在群里重新发起上传，或联系管理员。</p></body>';
    }
}


# ---------------------------------------------------------------------------
# 方案 B: 用一个独立子域名, 整个站点就是报告目录
# ---------------------------------------------------------------------------
# 这时 report_base_url 填 https://report.example.com/
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name report.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/report.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/report.example.com/privkey.pem;
#
#     root /var/www/lgtbot-report;      # 同样建议用 ASCII 软链
#     autoindex off;
#
#     location ~* ^/(?<report_file>[A-Za-z0-9._-]+\.html)$ {
#         expires 1d;
#         add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
#         add_header Content-Security-Policy
#             "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
#         add_header X-Content-Type-Options "nosniff" always;
#         add_header Referrer-Policy "no-referrer" always;
#     }
#     location / { return 404; }        # 只放行 .html, 其余一律拒绝
# }


# ---------------------------------------------------------------------------
# HTTP → HTTPS。报告链接是发到 QQ 群里的, 明文跳转比直接 404 友好
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name deploy.example.com;
    return 301 https://$host$request_uri;
}


# ============================================================================
# 部署后自查
#
#   nginx -t && systemctl reload nginx
#
#   # 1. 拿一个真实文件名试 (故意传一个会被拒的包, 从群消息里复制链接)
#   curl -I https://deploy.example.com/lgtbot-report/<记录号>-<随机串>.html
#   # 期望: 200, Content-Type: text/html, X-Robots-Tag 在
#
#   # 2. 列目录必须是失败的
#   curl -s -o /dev/null -w '%{http_code}\n' https://deploy.example.com/lgtbot-report/
#   # 期望: 404 (不是 200 + 文件列表)
#
#
# 排错: 文件明明在, 却出「报告不存在」/ 403 / 404
#
#   先看日志, 它会直接告诉你是哪一种, 别猜:
#     sudo tail -n 30 /var/log/nginx/error.log
#   "Permission denied" → 第 1 条;  "No such file or directory" → 第 2、3 条。
#
#   1) 目录穿越权限 (最常见)。nginx worker (www-data / nginx) 需要对路径上**每一
#      层**目录都有 x 权限。/home/<用户> 默认常是 700/750, 直接卡死在这一层。
#        ps -o user= -C nginx | sort -u          # 确认 worker 用户
#        namei -l /真实/绝对/路径/data/reports/   # 逐层看权限
#        sudo -u www-data ls /真实/绝对/路径/data/reports/
#      修: sudo chmod o+x /home/<用户>   (只给穿越, 不给列目录——那需要 r)
#      逐层检查 ElainaBot_v2 / plugins / 插件目录 / data / reports。
#      SELinux 环境 (CentOS/TencentOS) 还要看: sudo ausearch -m avc -ts recent
#
#   2) 中文路径。见文件开头, 用 ASCII 软链绕开。验证软链本身通不通:
#        sudo -u www-data cat /var/www/lgtbot-report/<某个真实文件名>.html | head -3
#
#   3) 文件名对不上。Linux 区分大小写, 随机串必须一字不差。核对一下:
#        ls -la /真实/绝对/路径/data/reports/
#
#
# 权限: nginx 只需要**读**。别给这个目录写权限, 也别把整个 data/ 暴露出去 ——
# 同级还有 config.yaml (含编译密钥)、records.jsonl、archives/ 里的原始压缩包。
# 软链和 alias 都必须精确指到 reports/ 这一层。
#
# 清理: 报告页跟着审核记录走 —— 后台删记录会连报告页一起删。若想额外按时间兜底,
# 加一条 cron 即可 (只删 90 天前的):
#   0 4 * * * find /真实/绝对/路径/data/reports -name '*.html' -mtime +90 -delete
# ============================================================================
