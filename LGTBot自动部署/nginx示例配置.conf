# ============================================================================
# LGTBot 自动部署 — 失败报告页的 nginx 示例配置
#
# 本插件只把 HTML 写进   <插件目录>/data/reports/
# 并按「面板里的 report_base_url + 文件名」拼出链接。怎么把那个前缀对应到这个
# 目录, 完全由这里决定 —— 插件不启动任何 HTTP 服务。
#
# 用之前改三处:
#   1. server_name          换成你的域名
#   2. root / alias 的路径  换成插件 data/reports 的真实绝对路径
#   3. ssl_certificate*     换成你的证书路径 (没有证书就先只留 :80 那段)
# 改完 nginx -t 验证, 再 systemctl reload nginx。
#
# 面板里 report_base_url 要填的值 = 下面 location 前缀对应的完整外部地址,
# 例如本文件的方案 A 对应   https://deploy.example.com/lgtbot-report/
# 末尾有没有斜杠都行, 插件会自己规整成单斜杠。
# ============================================================================


# ---------------------------------------------------------------------------
# 方案 A (推荐): 挂在已有站点的一个子路径下, 不用单独申请证书
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deploy.example.com;

    ssl_certificate     /etc/letsencrypt/live/deploy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deploy.example.com/privkey.pem;

    # …你原有的 location / 等配置保持不动…

    # 报告页。注意 alias 的路径末尾要有 /, 且 location 前缀也要有 /
    location /lgtbot-report/ {
        alias /opt/ElainaBot/plugins/LGTBot自动部署/data/reports/;

        # 只放行报告页本身。这个目录理论上只会有 .html, 但万一将来往 data/ 里
        # 塞了别的东西, 这条能保证不会被顺带暴露出去
        location ~* \.html$ {
            add_header Content-Type "text/html; charset=utf-8" always;

            # 报告链接是一次性发到群里的, 内容也不会再改 —— 让浏览器缓存一天,
            # 同时告诉搜索引擎别收录 (页面里也有 <meta name="robots">, 双保险)
            expires 1d;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

            # 页面是插件生成的纯静态 HTML, 内联一段 <style>, 没有任何脚本、
            # 图片、外部字体或表单 —— 所以可以把 CSP 收到极紧。真出现 XSS
            # (插件侧已对所有动态文字做 html.escape), 这条是最后一道闸
            add_header Content-Security-Policy
                "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # 关键: 不许列目录。文件名里的随机串就是访问凭据, 一旦能列目录,
        # 防枚举的设计当场失效
        autoindex off;

        # 猜错文件名 / 报告已随记录删除 → 给一句人话, 别露 nginx 默认页
        error_page 403 404 = @report_gone;
    }

    location @report_gone {
        default_type "text/html; charset=utf-8";
        return 404 '<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告不存在</title><body style="font:15px/1.7 system-ui,sans-serif;max-width:640px;margin:16vh auto;padding:0 20px;color:#444"><h1 style="font-size:20px">报告不存在或已被删除</h1><p>链接可能不完整，或对应的审核记录已在后台清理。请在群里重新发起上传，或联系管理员。</p></body>';
    }
}


# ---------------------------------------------------------------------------
# 方案 B: 用一个独立子域名, 整个站点就是报告目录
# ---------------------------------------------------------------------------
# 这时 report_base_url 填 https://report.example.com/
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name report.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/report.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/report.example.com/privkey.pem;
#
#     root /opt/ElainaBot/plugins/LGTBot自动部署/data/reports;
#     autoindex off;
#     index  index.html;          # 目录本身没有 index.html → 直接 404, 正合适
#
#     location ~* \.html$ {
#         expires 1d;
#         add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
#         add_header Content-Security-Policy
#             "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
#         add_header X-Content-Type-Options "nosniff" always;
#         add_header Referrer-Policy "no-referrer" always;
#     }
#     location / { return 404; }   # 只放行 .html, 其余一律拒绝
# }


# ---------------------------------------------------------------------------
# HTTP → HTTPS。报告链接是发到 QQ 群里的, 明文跳转比直接 404 友好
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name deploy.example.com;
    return 301 https://$host$request_uri;
}


# ============================================================================
# 部署后自查
#
#   nginx -t && systemctl reload nginx
#
#   # 1. 目录能读吗 (nginx 的 worker 用户要能进插件目录的每一层)
#   sudo -u www-data ls /opt/ElainaBot/plugins/LGTBot自动部署/data/reports/
#
#   # 2. 拿一个真实文件名试 (故意上传一个会被拒的包, 从群消息里复制链接)
#   curl -I https://deploy.example.com/lgtbot-report/<记录号>-<随机串>.html
#   # 期望: 200, Content-Type: text/html; charset=utf-8, X-Robots-Tag 在
#
#   # 3. 列目录必须是失败的
#   curl -s -o /dev/null -w '%{http_code}\n' https://deploy.example.com/lgtbot-report/
#   # 期望: 404 (不是 200 + 文件列表)
#
# 权限: nginx 只需要**读**。别给这个目录写权限, 也别把整个 data/ 暴露出去 ——
# 同级还有 config.yaml (含编译密钥)、records.jsonl、archives/ 里的原始压缩包。
# location 前缀务必精确指到 reports/ 这一层。
#
# 清理: 报告页跟着审核记录走 —— 后台删记录会连报告页一起删。若想额外按时间兜底,
# 加一条 cron 即可 (只删 90 天前的):
#   0 4 * * * find /opt/ElainaBot/plugins/LGTBot自动部署/data/reports -name '*.html' -mtime +90 -delete
# ============================================================================
